# creating payment service
- name: creating payment service
  hosts: payment
  become: yes

  tasks: 
# Task:1 installing python module
  - name: installing python module
    ansible.builtin.package:
      name: 
        - python3
        - gcc
        - python3-devel
      state: present

# Task:2 creating system user 
  - name: creating system user 
    ansible.builtin.user:
      name: roboshop
      system: yes
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"
      state: present

# Task:3 creating directory
  - name: creating directory
    ansible.builtin.file:
      path: /app
      state: directory
      owner: roboshop
      group: roboshop

# Task:4 Download the application code 
  - name: Download the application code 
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
      dest: /tmp/payment.zip

# Task:5 Unzip the dowunload code
  - name: Unzip the dowunload code
    ansible.builtin.unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes
  
# Task:6 Lets download the dependencies.
  - name: Lets download the dependencies.
    ansible.builtin.pip:
      requirements: /app/requirements.txt
      executable: pip3.9

# Task:7 Setup SystemD Payment Service
  - name: Setup SystemD Payment Service
    ansible.builtin.copy:
      src: payment.service
      dest: /etc/systemd/system/payment.service

# Task:8 Load the service
  - name: Load the service
    ansible.builtin.systemd_service:
      daemon_reload: true

# Task:9 Start And enable payment server
  - name: Start And enable payment server
    ansible.builtin.service:
      name: payment
      state: started
      enabled: yes

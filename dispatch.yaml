# creating dispatch service
- name: creating dispatch service
  hosts: dispatch
  become: yes

  tasks: 
# Task:1 installing golang  module
  - name: installing golang module
    ansible.builtin.package:
      name: 
        - golang
        - unzip
      state: present

# Task:2 creating system user 
  - name: creating system user 
    ansible.builtin.user:
      name: roboshop
      system: yes
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"
      state: present

# Task:3 creating directory
  - name: creating directory
    ansible.builtin.file:
      path: /app
      state: directory
      owner: roboshop
      group: roboshop

# Task:4 Download the application code 
  - name: Download the application code 
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/dispatch-v3.zip
      dest: /tmp/dispatch.zip

# Task:5 Unzip the dowunload code
  - name: Unzip the dowunload code
    ansible.builtin.unarchive:
      src: /tmp/dispatch.zip
      dest: /app
      remote_src: yes
  
# Task:6 Lets download the dependencies.
  - name: Download dependencies and build the application
    ansible.builtin.command: "{{ item }}"
    args:
      chdir: /app
    loop:
      - go mod init dispatch
      - go get
      - go build

# Task:7 Setup SystemD dispatch Service
  - name: Setup SystemD dispatch Service
    ansible.builtin.copy:
      src: dispatch.service
      dest: /etc/systemd/system/dispatch.service

# Task:8 Load the service
  - name: Load the service
    ansible.builtin.systemd_service:
      daemon_reload: true

# Task:9 Start And enable dispatch server
  - name: Start And enable dispatch server
    ansible.builtin.service:
      name: dispatch
      state: started
      enabled: yes

# creating Catalogue server
- name: create Catalogue server
  hosts: catalogue
  become: yes

  tasks:
# Task:-1 checking current module if it is not required moduble disable it
  - name: disable current module
    ansible.builtin.command: dnf module disable nodejs -y

# Task:-2 adding required module
  - name: Enable required module
    ansible.builtin.command: dnf module enable nodejs:20 -y

# Task:-3 installing nodejs module
  - name: installing nodejs
    ansible.builtin.package:
      name: nodejs
      state: present

# Task:-4 Force delete the existing roboshop user
  - name: Force delete the existing roboshop user
    ansible.builtin.user:
      name: roboshop
      state: absent

# Task:-5 Create roboshop system user if not exists, skip if exists
  - name: Task 1 - Create roboshop system user if not exists, skip if exists
    ansible.builtin.user:
      name: roboshop
      comment: "roboshop system user"
      system: yes
      home: /app
      shell: /sbin/nologin
      state: present

# Task:-6 removing existing app directory
  - name: removing existing app directory
    ansible.builtin.file:
      path: /app
      state: absent

# Task:-7 Creating app directory
  - name: Creating app directory
    ansible.builtin.file:
      path: /app
      state: directory


# Task:-8 removing existing code catalogue files
  - name: removing existing code catalogue files
    ansible.builtin.file:
      path: /tmp/catalogue.zip
      state: absent

# Task:-9 Download the application code to created app directory.
  - name: Download the application code to created app directory.
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip

# Task:- 10 Unzip the downloaded files
  - name: Unzip the downloaded catalogue files
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

# Task:- 11 Lets download the dependencies.
  - name: Lets download the dependencies
    community.general.npm:
      path: /app

# Task:- 12 Setup SystemD Catalogue Service
  - name: Setup SystemD Catalogue Service
    ansible.builtin.copy:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service
      remote_src: yes

  - name: daemon reload enable and start
    ansible.builtin.systemd_service:
      name: catalogue
      enabled: true
      state: started
      daemon_reload: true

# Task:- 13 load the mongodb server
  - name: load the mongodb server
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

# Task:- 14 Installing Client Mongodb repo
  - name: install mongodb-client
    ansible.builtin.package:
      name: mongodb-mongosh
      state: present

# Task:- 15 connnect to mongodb catalogue
  - name: Check whether catalogue database exists
    ansible.builtin.command:
      argv:
        - mongosh
        - mongodb.prasaddev.shop
        - --quiet
        - --eval
        - "db.getMongo().getDBNames().indexOf('catalogue')"
    register: catalogue_output
    changed_when: false

  - name: Print catalogue database check result
    ansible.builtin.debug:
      msg: "Catalogue database index: {{ catalogue_output.stdout }}"

  - name: Load products into MongoDB
    ansible.builtin.shell: "mongosh --host mongodb.prasaddev.shop < /app/db/master-data.js"
    when: catalogue_output.stdout | int < 0

  - name: Connect to catalogue database and get database name
    ansible.builtin.command:
      argv:
        - mongosh
        - --host
        - mongodb.prasaddev.shop
        - catalogue
        - --quiet
        - --eval
        - "db.getName()"
    register: catalogue_db
    changed_when: false

  - name: Display database name
    ansible.builtin.debug:
      var: catalogue_db.stdout

  - name: Display products from catalogue
    ansible.builtin.command:
      argv:
        - mongosh
        - --host
        - mongodb.prasaddev.shop
        - catalogue
        - --quiet
        - --eval
        - "db.products.find().forEach(p => printjson(p))"
    register: product_data
    changed_when: false

  - name: Print products
    ansible.builtin.debug:
      var: product_data.stdout


  - name: start and enable cataalogue
    ansible.builtin.service:
      name: catalogue
      enabled: yes
      state: started





























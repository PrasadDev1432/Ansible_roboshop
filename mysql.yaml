#create MySQL Server
- name: create MySQL Server
  hosts: mysql
  become: yes

  tasks:
# task:- 1 Installing MySQL Server
  - name: Install MySQL Server
    ansible.builtin.package:
      name: mysql-server
      state: present

# task:- 2 Start and Enable MySQL server
  - name: Start & Enable MySQL server
    ansible.builtin.service:
      name: mysqld
      state: started 
      enabled: yes

# task:- 3 Checking root password exist or not
  - name: Check root password
    ansible.builtin.command: mysql -uroot -pRoboShop@1 -e 'show databases;'
    register: mysql_check
    ignore_errors: true
    changed_when: false

# task: - 4 setup root password
  - name: setup root password
    ansible.builtin.command: mysql_secure_installation --set-root-pass RoboShop@1
    when: mysql_check.rc != 0
